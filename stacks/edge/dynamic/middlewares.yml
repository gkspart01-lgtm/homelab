# Dynamische Konfiguration (File-Provider): Middleware für authentik-Forward-Auth.
#
# Der Adressname "authentik-server" ist der Compose-Servicename im Stack
# "authentik"; beide Stacks teilen das externe Docker-Netz "edge".
http:
  middlewares:
    # Schützt einen Router: Traefik fragt den authentik-Outpost, ob die Anfrage
    # eine gültige Sitzung hat, und übernimmt die X-authentik-*-Header.
    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version

    # Sicherheits-Header für alle Router, die sie nutzen wollen
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
