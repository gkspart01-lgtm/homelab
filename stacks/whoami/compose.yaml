# Stack "whoami": Testdienst hinter Traefik + authentik-Forward-Auth.
# Zweck: beweisen, dass Routing und SSO-Gate funktionieren, bevor echte Dienste folgen.
services:
  whoami:
    image: traefik/whoami:v1.12.0
    container_name: whoami
    restart: unless-stopped
    networks: [edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN}`)
      - traefik.http.routers.whoami.entrypoints=websecure
      - traefik.http.routers.whoami.tls=true
      - traefik.http.routers.whoami.middlewares=authentik@file,security-headers@file
      - traefik.http.services.whoami.loadbalancer.server.port=80
      # Forward-Auth-Callback: /outpost.goauthentik.io/* muss auf der App-Domain
      # beim authentik-Outpost landen, nicht bei whoami (siehe authentik-Doku).
      - traefik.http.routers.whoami-outpost.rule=Host(`whoami.${DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      - traefik.http.routers.whoami-outpost.entrypoints=websecure
      - traefik.http.routers.whoami-outpost.tls=true
      - traefik.http.routers.whoami-outpost.priority=100
      - traefik.http.routers.whoami-outpost.service=authentik@file

networks:
  edge:
    external: true
