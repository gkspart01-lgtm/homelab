# Statische Testseite auf der Apex-Domain (hl.<DOMAIN>) — dient als Beweis,
# dass der Tunnel (rathole) bis zum Traefik durchlaeuft. Kein SSO.
services:
  testpage:
    image: nginx:1.29-alpine
    container_name: testpage
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      # HTTPS aus dem LAN
      - traefik.http.routers.testpage.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.testpage.entrypoints=websecure
      - traefik.http.routers.testpage.tls=true
      - traefik.http.routers.testpage.middlewares=security-headers@file
      - traefik.http.services.testpage.loadbalancer.server.port=80
      # Klartext vom Tunnel (VPS-Traefik terminiert TLS)
      - traefik.http.routers.testpage-plain.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.testpage-plain.entrypoints=webplain
      - traefik.http.routers.testpage-plain.middlewares=tunnel-headers@file
      - traefik.http.routers.testpage-plain.service=testpage

networks:
  edge:
    external: true
